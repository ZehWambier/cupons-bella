name: Manter álbum acordado
# O plano gratuito do Supabase pausa projetos sem uso por 7 dias.
# Este job chama o álbum a cada 3 dias. A cada ~45 dias faz um commit
# vazio, porque o GitHub desliga agendamentos de repositórios parados há 60 dias.
on:
  schedule:
    - cron: "17 11 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cutucar o Supabase
        run: |
          curl -fsS -X POST "https://jzsuqorksqumwhpluvnh.supabase.co/functions/v1/album" \
            -H "Content-Type: application/json" -d '{"acao":"ping"}'
      - uses: actions/checkout@v4
      - name: Manter o agendamento ativo
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter agendamento ativo"
            git push
          fi
